[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlvr-grpo-agent"
version = "0.1.0"
description = "Verifiable-reward GRPO for tool-using reasoning agents, implemented from scratch in NumPy."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
scaleup = ["torch>=2.0", "transformers>=4.40", "trl>=0.12", "datasets>=2.0", "vllm>=0.6"]
dev = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
